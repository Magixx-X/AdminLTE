{% extends 'base.html' %}{% block body_class %}hold-transition login-page{% endblock %}{% block page_id %}login{% endblock %}
{% block content %}<div class="login-box"><div class="login-logo"><b>信息</b>查询管理</div><div class="card"><div class="card-body login-card-body">
<p class="login-box-msg">登录信息查询管理平台</p>
<div id="message" role="alert" aria-live="polite"></div><form id="login-form">
<label for="username">账号</label><input id="username" class="form-control mb-3" name="username" required autocomplete="username">
<label for="password">密码</label><input id="password" class="form-control mb-3" name="password" type="password" required autocomplete="current-password">
<button class="btn btn-primary btn-block" type="submit">登录</button></form><p class="text-muted mt-3 mb-0">首次账号由管理员在服务器安全初始化。</p>
</div></div></div>{% endblock %}
